- id: R4-17
  type: round4
  title: Make CI failures observable (annotations + job summary)
  status: DONE-VERIFIED
  evidence: >-
    The most valuable change of this session. Red Pytest jobs could not be
    diagnosed at all: runner logs return 0 bytes here and log download is
    network-blocked. Fixed by teeing pytest output and emitting each
    FAILED/ERROR line as a workflow-command annotation, readable via the
    check-runs annotations endpoint.
    $GITHUB_STEP_SUMMARY was tried first and does NOT surface in
    output.summary, so annotations are the channel that works.
    `set -o pipefail` is essential - without it the tee swallows pytest's exit
    code and every failure silently becomes a pass.
  tests:
    - tests/test_ci_workflow_hardening.py
  files:
    - .github/workflows/agent.yml
    - .github/workflows/ci.yml
    - .github/workflows/ci-cd.yml
