- id: R4-28
  type: round4
  title: Burned AdminPass12345! now rejected in every environment
  status: DONE-VERIFIED
  evidence: >-
    Follow-up to the DASHBOARD_PASSWORD default change (itself carried in
    FIX-15). Verification found the fix was incomplete.
    Measured with no .env present, from a directory outside the repo, so the
    Field default applies rather than a bootstrap-generated value:
      production, unset                    -> REJECTED (must be explicitly provided)
      staging, unset                       -> REJECTED (must be explicitly provided)
      production, strong explicit value    -> ACCEPTED
      production, AdminPass12345!          -> REJECTED (shipped default)
      production, too short                -> REJECTED (insecure)
    So production and staging DO fail closed. An earlier claim that they did
    was verified with the wrong environment variable (APP_ENV instead of ENV),
    which silently left the process in development mode; that claim is
    corrected here.
    THE GAP THAT WAS FOUND AND CLOSED: before this change the legacy-literal
    check sat inside the `ENV in (staging, production) or
    ENFORCE_SECRET_ENTROPY` guard. Development - the default ENV - therefore
    still accepted AdminPass12345! outright. Since the value is in git
    history it is public, and any development deployment that gets exposed
    ships a known admin password. The check was moved above the
    environment guard so it fires unconditionally, in all three environments,
    and is not gated behind the optional entropy flag.
    Verified after the fix: development + AdminPass12345! now REJECTED.
    development + empty is still ACCEPTED, which is intended - both seeding
    sites (dashboard/auth.py:43 and services/storage/reset_service.py:488)
    replace an empty or legacy value with secrets.token_urlsafe(24) and log it
    once, and storage is PBKDF2-HMAC-SHA256 hashed, never plaintext.
    ROTATE THIS SECRET is preserved in settings.py and in the error text. If
    any deployment ever used AdminPass12345!, treat it as permanently
    compromised and rotate it everywhere.
    New test: test_burned_default_password_rejected_in_every_environment.
    Sabotage-verified: neutering the unconditional check (short-circuiting it
    with `if False and`) fails exactly that test.
  tests:
    - tests/test_config_consistency.py
  files:
    - shorts_engine/config/settings.py
    - tests/test_config_consistency.py
  commits:
    - dbaa05951cea977d422260dbf6148d8e7572c58a

