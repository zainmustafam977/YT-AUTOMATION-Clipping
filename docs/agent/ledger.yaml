    evidence establishes official 3.10 support: the only 3.10 claims were the
    README badge and a MIN_PYTHON_VERSION floor of (3, 10) in
    setup_environment.py, both of which contradicted the packaging metadata
    and have been aligned to 3.11. A guard test
    (test_matrix_python_versions_satisfy_requires_python) now fails if the
    matrix and requires-python ever disagree again.
  tests:
