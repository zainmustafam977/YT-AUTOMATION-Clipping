# --- Resumption: root causes found once failures were observable ---
# Every blocker below was invisible because runner logs are unreadable from
# this environment: the Actions logs endpoint returns 0 bytes with the
# available token, and `gh run view --log-failed` is blocked at
# results-receiver.actions.githubusercontent.com. CI-4 added workflow-command
