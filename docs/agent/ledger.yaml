- id: R4-30
  type: round4
  title: Playwright browser E2E cannot run locally; CI job added and gated
  status: DEFERRED
  evidence: >-
    18 of the 23 skipped tests are browser-backed E2E under tests/e2e/. They
    have never produced signal in this environment.
    WHY IT CANNOT RUN HERE: `python -m playwright install chromium` fails with
    "Failed to download Chrome for Testing ... Download failure, code=1". The
    Chrome for Testing CDN is outside this sandbox's network allowlist (only
    github.com, codeload.github.com, api.github.com, registry.npmjs.org,
    pypi.org and files.pythonhosted.org are reachable). This is an environment
    restriction, not a product defect. Three download routes were tried across
    earlier rounds (CDN, apt package, cached browser) and all failed.
    WHAT WAS DONE INSTEAD: a `browser-tests` job was added to ci.yml that
    installs Chromium with `playwright install --with-deps chromium` and runs
    `pytest tests/e2e`. GitHub-hosted runners have no such network
    restriction, so the download succeeds there.
      It is gated to `schedule || workflow_dispatch`, exactly like
      network-tests, so a browser download or a flaky UI assertion cannot turn
      a routine pull request red. It is a real gate - it fails the workflow
      when it runs - it just runs off the pull-request path.
      timeout-minutes 15, matching the repo-wide policy guard.
      It includes a no-silent-skip guard: if pytest exits 0 but no test
      actually ran, the step fails rather than reporting a pass, because a
      browser that silently fails to launch would otherwise look green.
    WHY IT IS STILL DEFERRED: the job has not been executed. The same token
    limitation as R4-27 prevents dispatching it - see that row. The job
    therefore exists and is ready, but no run has been observed.
    MANUAL STEPS: Actions tab -> "Industrial CI/CD & Reliability Gate" ->
    Run workflow -> branch arena/c08e735f-yt-automation-clipping. A user
    session has the workflows scope this token lacks.
