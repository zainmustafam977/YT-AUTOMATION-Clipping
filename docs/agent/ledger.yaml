- id: R4-19
  type: round4
  title: Bootstrapped installs could not import settings (blank List env vars)
  status: DONE-VERIFIED
  evidence: >-
    pydantic-settings JSON-decodes complex fields at the dotenv source, so the
    empty GEMINI_API_KEYS / GROQ_API_KEYS / OPENAI_API_KEYS /
    OPENROUTER_API_KEYS entries in .env.example raised SettingsError before
    any validator ran. setup_environment.py copies that template verbatim to
    .env, so after the documented bootstrap the application could not be
    imported at all and every test touching config died at collection. This
    broke all four matrix legs. Pre-existing: the empty entries are unchanged
    from 27a3133.
    A plain mode="before" validator does NOT fix it - the error is raised
    upstream at the source. Fixed by annotating the fields NoDecode so the raw
    string reaches the validator, which accepts JSON arrays, comma-separated
    values, and blank (meaning no keys).
