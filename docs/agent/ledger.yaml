- id: R4-25
  type: round4
  title: Intermittent matrix-leg failure, and the blind spot that hid it
  status: DONE-VERIFIED
  evidence: >-
    Two matrix legs failed non-reproducibly, each in a way that produced no
    test-level information:
      23f5d97 -> Test Suite Matrix (windows-latest - Py3.10): failure
      5b9754e -> Test Suite Matrix (ubuntu-latest - Py3.10): failure
    Crucially, ubuntu Py3.10 SUCCEEDED on 23f5d97 and failed on 5b9754e, while
    windows Py3.10 did the opposite. Different legs, different commits, no
    overlap - the signature of an intermittent failure, not of either commit.
    Neither commit touches product or test code (one is a ledger and generated
    docs change, the other a .gitignore rule).
    Why it was undiagnosable: CI-4's reporting only annotates lines matching
    FAILED or ERROR. When pytest exits non-zero WITHOUT reaching per-test
    reporting - a crash, a teardown kill, an interrupted run - nothing is
    emitted and the job reads as a bare "Process completed with exit code 1".
    Runner logs are not readable from a restricted environment (the logs
    endpoint redirects to a blocked blob host), so the failure had no channel.
    CI-13 closes the blind spot: on a non-zero exit with no FAILED or ERROR
    line, it annotates the raw tail of the pytest output. Verified in
    isolation across three cases (normal failure, crash with no FAILED line,
    and success).
    Current state: on 7d433f7 (CI-13) ubuntu Py3.10 passed, confirming the
    failure is intermittent rather than caused by 5b9754e. The root cause is
    still unknown. On that same run the windows Py3.11 leg was CANCELLED by
    GitHub (infrastructure, not a test outcome), so it is unverified for that
    head; the available token cannot re-run jobs or dispatch workflows (403).

    ROOT CAUSE FOUND (CI-14). Exactly one test is marked `network`:
    test_pipeline_runner_processes_local_ingested_video. It calls
    PipelineRunner.run_pipeline_for_video, which initialises
    TranscriptionService and DOWNLOADS A FASTER-WHISPER MODEL FROM THE
    HUGGINGFACE HUB AT TEST TIME. Reproduced locally: the run log shows
    "Initializing TranscriptionService (model=base, device=cpu,
    compute_type=int8)" followed by "Failed to load faster-whisper model:
    ConnectError: TLS/SSL connection has been closed" - it reaches for the
    network, so its outcome tracks a third party's availability and rate
    limiting rather than the code under test.
    The correlation is what identified it, and it is clean:
      agent.yml   uses -m "not network"  ->  never flaked, across every run
      ci.yml      no filter              ->  failed twice
      ci-cd.yml   no filter              ->  same exposure, now closed
    The failures moved between legs and operating systems between runs, and
    neither commit touched product or test code - the signature of an external
    dependency, not a regression.
    Fixed by adding -m "not network" to ci.yml and ci-cd.yml to match
    agent.yml, and by quarantining rather than dropping the network tests:
    a new `network-tests` job runs -m network nightly and on manual dispatch.
    It is a real gate that fails the workflow when it breaks - it simply runs
    on a cadence where a third-party outage is distinguishable from a
    regression.
  tests:
    - tests/test_ci_workflow_hardening.py
  files:
    - .github/workflows/ci.yml
    - .github/workflows/ci-cd.yml
  commits:
    - 7d433f757a97b491eb970a1f34f432c57827cb2d
    - c714e8e27c1527ed1079449a06f815d53a8abec3

