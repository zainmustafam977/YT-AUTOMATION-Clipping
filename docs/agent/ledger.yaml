  status: DONE-VERIFIED
  evidence: >-
    tests/test_packaging_dependencies.py imported tomllib unconditionally.
    tomllib is stdlib from 3.11, so on the 3.10 matrix legs the module could
    not be imported and the whole file failed to collect with exit code 2.
