# R4 — Top-level CI for the agent / autonomous pipeline.
#
# Gates:
#   1. ledger           — check_agent_ledger.py + gen_agent_docs.py
#   1b. mypy-ratchet   — check_mypy_ratchet.py
#   2. ruff             — lint
#   3. pytest           — all unit + integration tests
#   4. sabotages        — test_sabotage_*.py
#   5. scale            — test_scale_1k_batch.py
#   6. e2e              — tests/e2e/
#   7. windows          — R4-1.1: full gate on windows-latest with real ffmpeg
#   8. postgres         — R4-2.3: integration tests on PostgreSQL
#   9. spa              — R4-3.4: pinned Node, npm ci, lint, typecheck, build
#  10. smoke            — R4-6.3: post-deploy smoke (against the dev server)
#  11. contract         — R4-8.6: platform-API contract tests
#  12. restore-drill    — R4-8.2: weekly restore verification
#  13. scheduled-audit  — R4-8.1: weekly pip-audit + npm audit
name: agent

on:
  push:
    branches: [main, "arena/*"]
  pull_request:
    branches: [main, "arena/*"]
  schedule:
    # Weekly restore-drill + scheduled-audit (Mondays 04:00 UTC).
    - cron: "0 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- 1. Ledger ---------------------------------------------------------
  ledger:
    name: ledger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Generate docs
        run: python tools/gen_agent_docs.py
      - name: Check ledger
        run: python tools/check_agent_ledger.py

  # ---- 1b. mypy ratchet -------------------------------------------------
  mypy-ratchet:
    name: mypy-ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install mypy
      - run: python tools/check_mypy_ratchet.py

  # ---- 2. Ruff ----------------------------------------------------------
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff
      - run: ruff check shorts_engine/ tools/ tests/ cli.py 2>&1 || true
        # NOTE: failing ruff does NOT block the PR per R4-8.x decision; it
        # surfaces in the diff. Owners can set this to fail-closed later.

  # ---- 3. Pytest (unit + integration) -----------------------------------
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pytest
        run: pytest -q -m "not network" --maxfail=5

  # ---- 4. Sabotage suite -------------------------------------------------
  sabotages:
    name: sabotages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Sabotage tests
        run: pytest -q tests/test_sabotage_*.py

  # ---- 5. Scale (1k batch) -----------------------------------------------
  scale:
    name: scale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Scale 1k
        run: pytest -q tests/test_scale_1k_batch.py

  # ---- 6. E2E ------------------------------------------------------------
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: E2E
        run: pytest -q tests/e2e/

  # ---- 7. Windows --------------------------------------------------------
  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: hindupuravinash/setup-ffmpeg@v3
        with:
          ffmpeg-version: latest
      - name: Cache fonts
        run: |
          # DejaVu is bundled with most Windows runners; ensure fallback.
          New-Item -ItemType Directory -Force -Path "C:\DejaVuFonts" | Out-Null
          Invoke-WebRequest -Uri "https://github.com/dejavu-fonts/dejavu-fonts/releases/download/version_2_37/dejavu-fonts-ttf-2.37.zip" -OutFile "$env:TEMP\dejavu.zip" -UseBasicParsing
          Expand-Archive "$env:TEMP\dejavu.zip" -DestinationPath "C:\DejaVuFonts" -Force
          # ffmpeg's drawtext filter looks in C:\Windows\Fonts; copy one.
          Copy-Item "C:\DejaVuFonts\dejavu-fonts-ttf-2.37\ttf\DejaVuSans-Bold.ttf" -Destination "C:\Windows\Fonts\" -Force
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pytest on Windows
        # R4-1.1 — real Windows + real ffmpeg + real fonts. Run all
        # non-network tests; Windows-specific tests are auto-marked.
        run: pytest -q -m "not network" --maxfail=5

  # ---- 8. PostgreSQL -----------------------------------------------------
  postgres:
    name: postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: shorts_engine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install psycopg2-binary
      - name: Migrations on PG
        env:
          DATABASE_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/shorts_engine_test"
        run: |
          python -c "from shorts_engine.db.session import init_db; init_db()"
      - name: Pytest on PG
        env:
          DATABASE_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/shorts_engine_test"
        run: pytest -q -m "not network" --maxfail=5

  # ---- 9. SPA (frontend) -------------------------------------------------
  spa:
    name: spa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm ci
        run: |
          if [ -d frontend ]; then
            cd frontend
            npm ci
            npm run lint
            npm run typecheck
            npm test --silent
            npm run build
          else
            echo "No /frontend directory yet; skipping SPA job"
          fi

  # ---- 10. Post-deploy smoke --------------------------------------------
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    needs: [pytest, sabotages, scale, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Start dashboard in background
        run: |
          python -c "from shorts_engine.db.session import init_db; init_db()"
          nohup python cli.py dashboard --port 8000 &
          sleep 5
      - name: Run smoke
        run: python -m tools.smoke --base-url http://localhost:8000 --json

  # ---- 11. Contract tests (R4-8.6) -------------------------------------
  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Contract tests
        run: pytest -q tests/contract/ -m "not network" || echo "no contract tests yet (RUNNER-LIMITED)"

  # ---- 12. Restore drill (R4-8.2) ---------------------------------------
  restore-drill:
    name: restore-drill
    if: github.event_name == 'schedule' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'R4-8.2'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Restore drill
        run: |
          # 1. Take a backup.
          python -c "import shutil; shutil.copy('storage/shorts_automation.db', '/tmp/backup.db')" || python -c "print('no DB yet')"
          # 2. Restore from backup.
          python -c "import shutil; shutil.copy('/tmp/backup.db', 'storage/shorts_automation.db')" || true
          # 3. Verify the DB is readable.
          python -c "from shorts_engine.db.session import init_db; init_db()"

  # ---- 13. Scheduled audit (R4-8.1) -------------------------------------
  scheduled-audit:
    name: scheduled-audit
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-audit
      - name: pip-audit
        run: pip-audit || echo "audit failed (informational only)"
