name: Industrial CI/CD & Reliability Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Nightly: the only time the network-dependent tests run (see the
  # `network-tests` job). Running them on every push made the matrix
  # intermittent, because they fetch an ML model from a third-party hub.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  lint-and-format:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Execute Ruff Linter
        run: ruff check .

  security-audit:
    name: Security & CVE Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Run Dependency Vulnerability Audit
        # Fail-closed: a vulnerable declared dependency must block the build.
        # Scoped with -r so this audits the project's DECLARED dependencies;
        # without -r it audits the runner image's own pip/setuptools, which is
        # noise rather than signal.
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r requirements.txt
          pip-audit -r requirements-dev.txt

  test-matrix:
    name: Test Suite Matrix (${{ matrix.os }} - Py${{ matrix.python-version }})
    needs: [lint-and-format]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Source Code
        # fetch-depth: 0 - this job runs the whole suite, which includes
        # tests/test_fresh_eyes.py::test_ledger_consistency. That test shells
        # out to tools/check_agent_ledger.py, which validates every cited
        # commit id with `git cat-file -t`. Under the default fetch-depth: 1
        # (tip commit only) it exits 1 on "commit ... does not exist in this
        # repository" - which reads as a fabricated commit id but is really
        # just a truncated checkout.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg --no-progress
          echo "C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg\bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Automated Environment Bootstrap
        run: python setup_environment.py

      - name: Run Pytest Test Suite
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
          KMP_DUPLICATE_LIB_OK: "TRUE"
        # bash on every OS: `set -o pipefail` and `tee` are not PowerShell,
        # and windows-latest defaults to PowerShell. Without this the step
        # fails instantly with exit code 1 and collects no results at all.
        #
        # The failure reporting lives in THIS step rather than a second one:
        # a separate step means a second bash launch, and Git Bash on the
        # Windows runners intermittently dies during startup with
        # 0xC0000142 (STATUS_DLL_INIT_FAILED), which failed the job after
        # the tests had already passed.
        shell: bash
        run: |
          set -o pipefail
          # -m "not network": keeps this job hermetic. The one test marked
          # `network` (test_pipeline_runner_processes_local_ingested_video)
          # downloads a faster-whisper model from the HuggingFace Hub at test
          # time, so its outcome depends on a third party's availability and
          # rate limiting rather than on the code under test. That made this
          # matrix fail intermittently on unrelated commits. agent.yml already
          # excludes network tests by design; the dedicated `network-tests`
          # job below still runs them.
          python -m pytest tests -q -m "not network" 2>&1 | tee pytest-output.txt
          pytest_status=${PIPESTATUS[0]}

          {
            echo "### Pytest result"
            echo
            echo '```'
            tail -n 60 pytest-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          grep -E '^(FAILED|ERROR) ' pytest-output.txt > failed-lines.txt || true
          if [ -s failed-lines.txt ]; then
            {
              echo
              echo "### Failing tests"
              echo
              cat failed-lines.txt
            } >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              echo "::error title=Pytest failure::$line"
            done < failed-lines.txt
          fi

          echo "--- failing tests ---"
          cat failed-lines.txt

          # Blind-spot guard: a non-zero exit with no parseable FAILED/ERROR
          # line is otherwise completely undiagnosable (runner logs are not
          # readable from every environment). That happens when pytest dies
          # in a way that never reaches per-test reporting - a crash, a
          # teardown kill, an interrupted run. Emit the raw tail as
          # annotations so the failure is at least visible.
          if [ "$pytest_status" -ne 0 ] && [ ! -s failed-lines.txt ]; then
            echo "::error title=Pytest exited $pytest_status with no FAILED or ERROR line::Annotating the raw output tail; the usual per-test reporting did not run."
            tail -n 40 pytest-output.txt > pytest-tail.txt
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=pytest-output-tail::$line"
            done < pytest-tail.txt
          fi

          exit $pytest_status


  docker-build:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Free Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: shorts-engine:ci-test

  # Network-dependent tests, quarantined to nightly + manual dispatch.
  #
  # These are not run on push/PR: the suite marked `network` downloads a
  # faster-whisper model from the HuggingFace Hub, so its result tracks that
  # hub's availability and rate limiting rather than the code under test. On
  # every push it made the matrix fail intermittently on unrelated commits
  # (windows Py3.10 on one run, ubuntu Py3.10 on the next).
  #
  # Quarantining is not suppression: this job is a real gate that fails the
  # workflow when it breaks. It just runs on a cadence where an external
  # outage is distinguishable from a regression.
  network-tests:
    name: Network Tests (nightly / manual)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 15 to match the repo-wide policy enforced by
    # test_ci_workflow_has_timeout_minutes_on_all_jobs. One test plus a model
    # download fits comfortably; the other matrix legs run 1131 tests in
    # less than this.
    timeout-minutes: 15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Automated Environment Bootstrap
        run: python setup_environment.py

      - name: Run Network-Marked Tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests -q -m network 2>&1 | tee pytest-output.txt
          pytest_status=${PIPESTATUS[0]}

          {
            echo "### Network tests result"
            echo
            echo '```'
            tail -n 60 pytest-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          grep -E '^(FAILED|ERROR) ' pytest-output.txt > failed-lines.txt || true
          if [ -s failed-lines.txt ]; then
            while IFS= read -r line; do
              echo "::error title=Network test failure::$line"
            done < failed-lines.txt
          fi

          if [ "$pytest_status" -ne 0 ] && [ ! -s failed-lines.txt ]; then
            echo "::error title=Network tests exited $pytest_status with no FAILED or ERROR line::Annotating the raw output tail."
            tail -n 40 pytest-output.txt > pytest-tail.txt
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=network-output-tail::$line"
            done < pytest-tail.txt
          fi

          exit $pytest_status
