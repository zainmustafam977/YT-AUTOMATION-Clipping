name: Industrial CI/CD & Reliability Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-format:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Execute Ruff Linter
        run: ruff check .

  security-audit:
    name: Security & CVE Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Run Dependency Vulnerability Audit
        # Fail-closed: a vulnerable declared dependency must block the build.
        # Scoped with -r so this audits the project's DECLARED dependencies;
        # without -r it audits the runner image's own pip/setuptools, which is
        # noise rather than signal.
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r requirements.txt
          pip-audit -r requirements-dev.txt

  test-matrix:
    name: Test Suite Matrix (${{ matrix.os }} - Py${{ matrix.python-version }})
    needs: [lint-and-format]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Source Code
        # fetch-depth: 0 - this job runs the whole suite, which includes
        # tests/test_fresh_eyes.py::test_ledger_consistency. That test shells
        # out to tools/check_agent_ledger.py, which validates every cited
        # commit id with `git cat-file -t`. Under the default fetch-depth: 1
        # (tip commit only) it exits 1 on "commit ... does not exist in this
        # repository" - which reads as a fabricated commit id but is really
        # just a truncated checkout.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg --no-progress
          echo "C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg\bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Automated Environment Bootstrap
        run: python setup_environment.py

      - name: Run Pytest Test Suite
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
          KMP_DUPLICATE_LIB_OK: "TRUE"
        run: |
          set -o pipefail
          python -m pytest tests -q 2>&1 | tee pytest-output.txt

      - name: Publish test summary
        # Runner logs are not readable from every caller (the logs endpoint
        # returns 0 bytes for some tokens and `gh run view --log-failed` is
        # blocked on restricted networks), so failures are also emitted as
        # annotations, which have a dedicated read endpoint. The `if: always()`
        # keeps this reporting on failure, and `set -o pipefail` above stops
        # the `tee` from swallowing pytest's exit code.
        if: always()
        run: |
          {
            echo "### Pytest result"
            echo
            echo '```'
            tail -n 60 pytest-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          grep -E '^(FAILED|ERROR) ' pytest-output.txt > failed-lines.txt || true

          if [ -s failed-lines.txt ]; then
            {
              echo
              echo "### Failing tests"
              echo
              cat failed-lines.txt
            } >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              echo "::error title=Pytest failure::$line"
            done < failed-lines.txt
          fi

          echo "--- failing tests ---"
          cat failed-lines.txt

  docker-build:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Free Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: shorts-engine:ci-test
