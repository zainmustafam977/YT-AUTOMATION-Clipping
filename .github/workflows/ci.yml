name: Industrial CI/CD & Reliability Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-format:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Execute Ruff Linter
        run: ruff check .

  security-audit:
    name: Security & CVE Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Run Dependency Vulnerability Audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          # Fail the job on any known vulnerability (no `|| true`).
          pip-audit -r requirements.txt

  test-matrix:
    name: Test Suite Matrix (${{ matrix.os }} - Py${{ matrix.python-version }})
    needs: [lint-and-format]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Mirrors pyproject.toml's requires-python = ">=3.11": the 3.10 jobs could
      # never pass (the suite imports tomllib, stdlib only from 3.11), so they
      # reported a red pipeline for a version the project does not support.
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg --no-progress
          echo "C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg\bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Automated Environment Bootstrap
        run: python setup_environment.py

      - name: Run Pytest Test Suite
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
          KMP_DUPLICATE_LIB_OK: "TRUE"
        # Browser E2E (tests/e2e) needs Playwright plus a Chromium download, so
        # it is opt-in: `pip install -e .[e2e]` then `pytest -m e2e`.
        # Use bash on Windows: PowerShell fails to set the console window title
        # when stdout is a pipe (ResourceUnavailable 0xE9) and flips the step's
        # exit code to 1 even though every test passed.
        shell: bash
        run: python -m pytest tests -q -m "not e2e"

  docker-build:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Free Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: shorts-engine:ci-test
