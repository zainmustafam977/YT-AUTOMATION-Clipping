[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shorts-engine"
version = "0.1.0"
description = "Automated YouTube Shorts repurposing platform"
readme = "CLARIFICATION_QUESTIONS.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "cryptography>=42.0.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "opencv-python-headless>=4.8.0",
    "pillow>=10.2.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "faster-whisper>=1.0.0",
    "yt-dlp>=2024.0.0",
    "httpx>=0.27.0",
    "google-genai>=1.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth>=2.14.0,<3",
    "sentry-sdk>=1.40.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "groq>=0.9.0",
    "scipy>=1.11.0",
    "portalocker>=2.8.0",
    "watchdog>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "frontend",
    "scratch",
    "tools",
    "storage",
    "dist",
    "build",
    "*.egg-info",
    "in progress dev",
    "docs",
    "tests",
    "scripts",
    "patch.py",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.setuptools.packages.find]
where = ["."]
include = ["shorts_engine*"]

